; XIAO ESP32S3 Sense - wormbot visual tracking
;   pio run -e capture -t upload      dataset-capture firmware (camera web server)
;   pio run -e tracker -t upload      tracking firmware (needs the Edge Impulse library in lib/)
;   pio run -e tracker_stub           tracking firmware with a fake detector (no model needed)
;
; Both firmwares share lib/xiao_cam and the camera settings saved in NVS, so the
; tracker sees exactly the image the dataset was captured with.

[env]
platform = espressif32@7.1.3
framework = arduino
board = seeed_xiao_esp32s3
board_build.partitions = default_8MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -Iinclude

[env:capture]
build_src_filter = +<capture/>

[env:tracker]
build_src_filter = +<tracker/>
build_flags =
    ${env.build_flags}
    -O2

[env:tracker_stub]
build_src_filter = +<tracker/>
build_flags =
    ${env.build_flags}
    -DTRACKER_STUB
